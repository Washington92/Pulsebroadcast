[package]
name = "pulse-broadcast"
version = "0.1.0"
description = "PULSE Broadcast desktop"
authors = ["PULSE Broadcast contributors"]
edition = "2021"

[lib]
name = "pulse_broadcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
