name: wMix engine validation (Windows)
on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/wmix-engine-validation.yml'
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wmix-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate official wMix Windows icon
        working-directory: .
        run: |
          python -m pip install pillow
          python scripts/generate_wmix_icon.py
      - name: Install and bundle FFmpeg executable
        shell: pwsh
        working-directory: .
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          $binary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Filter ffmpeg.exe -Recurse -File | Where-Object { $_.DirectoryName -like '*bin' } | Select-Object -First 1
          if (-not $binary) { throw "Real FFmpeg executable not found; refusing to package PATH shim" }
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          Copy-Item $binary.FullName src-tauri/resources/ffmpeg.exe
          & src-tauri/resources/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg failed to execute" }
      - run: cargo test --locked
        if: ${{ hashFiles('src-tauri/Cargo.lock') != '' }}
      - run: cargo test
        if: ${{ hashFiles('src-tauri/Cargo.lock') == '' }}
      - run: cargo check
      - name: Confirm libobs scope
        shell: pwsh
        run: Write-Host 'Static compile only; actual libobs startup, camera capture, Preview/Program and GPU require Windows hardware validation.'
