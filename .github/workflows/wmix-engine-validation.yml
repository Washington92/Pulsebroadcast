name: wMix engine validation (Windows)
on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/wmix-engine-validation.yml'
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wmix-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate official wMix Windows icon
        working-directory: .
        run: |
          python -m pip install pillow
          python scripts/generate_wmix_icon.py
      - name: Install and bundle FFmpeg executable
        shell: pwsh
        working-directory: .
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          $binary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Filter ffmpeg.exe -Recurse -File | Where-Object { $_.DirectoryName -like '*bin' } | Select-Object -First 1
          if (-not $binary) { throw "Real FFmpeg executable not found; refusing to package PATH shim" }
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          Copy-Item $binary.FullName src-tauri/resources/ffmpeg.exe
          & src-tauri/resources/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg failed to execute" }
      - run: cargo test --locked
        if: ${{ hashFiles('src-tauri/Cargo.lock') != '' }}
      - run: cargo test
        if: ${{ hashFiles('src-tauri/Cargo.lock') == '' }}
      - run: cargo check
      - name: Confirm libobs scope
        shell: pwsh
        run: Write-Host 'Static compile only; actual libobs startup, camera capture, Preview/Program and GPU require Windows hardware validation.'

  libobs-runtime-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: obs-cache
        with:
          path: ${{ runner.temp }}/obs-33.0.1
          key: obs-studio-33.0.1-windows-x64
      - name: Download pinned OBS Studio 33.0.1 x64 package
        if: steps.obs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'OBS-Studio-33.0.1-Windows-x64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'obs-33.0.1'
          Invoke-WebRequest -Uri 'https://github.com/obsproject/obs-studio/releases/download/33.0.1/OBS-Studio-33.0.1-Windows-x64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
      - name: Resolve portable OBS root
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'obs-33.0.1'
          $dll = Get-ChildItem -LiteralPath $destination -Filter 'obs.dll' -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]+bin[\\/]+64bit[\\/]+obs\.dll$' } |
            Select-Object -First 1
          if (-not $dll) { throw "OBS 33.0.1 x64 package did not contain bin/64bit/obs.dll" }
          $obsRoot = $dll.Directory.Parent.Parent.FullName
          $d3d11 = Join-Path $dll.Directory.FullName 'libobs-d3d11.dll'
          $imageSource = Join-Path $obsRoot 'core\image-source\image-source.dll'
          $dshowModule = Join-Path $obsRoot 'core\win-dshow\win-dshow.dll'
          if (-not (Test-Path -LiteralPath $d3d11 -PathType Leaf)) {
            throw "OBS D3D11 graphics module missing: $d3d11"
          }
          if (-not (Test-Path -LiteralPath $imageSource -PathType Leaf)) {
            $rootDirs = Get-ChildItem -LiteralPath $obsRoot -Directory | Select-Object -ExpandProperty Name
            throw "OBS 33 core image-source module missing: $imageSource; root directories: $($rootDirs -join ', ')"
          }
          if (-not (Test-Path -LiteralPath $dshowModule -PathType Leaf)) {
            throw "OBS 33 core win-dshow module missing: $dshowModule"
          }
          "OBS_ROOT=$obsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "OBS root: $obsRoot"
          Write-Host "OBS D3D11: $d3d11"
          Write-Host "OBS core image-source: $imageSource"
          Write-Host "OBS core win-dshow: $dshowModule"
          Write-Host "OBS ProductVersion: $((Get-Item -LiteralPath $dll.FullName).VersionInfo.ProductVersion)"
      - name: Run libobs 33.0.1 D3D11, audio, DirectShow and dual-display CUT smoke test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'libobs-runtime-smoke.log'
          Start-Transcript -Path $log
          try {
            & "$PSHOME\pwsh.exe" -NoProfile -File tests/libobs_preview_cut_smoke.ps1 -ObsRoot $env:OBS_ROOT
          } finally {
            Stop-Transcript
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libobs-runtime-smoke-log
          path: ${{ runner.temp }}/libobs-runtime-smoke.log
          if-no-files-found: ignore
          retention-days: 7
