name: Windows desktop build
on:
  # Full installer builds are explicit release-candidate checks, not per-commit builds.
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/windows.yml'
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install --no-audit --no-fund
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate official wMix Windows icon
        run: |
          python -m pip install pillow
          python scripts/generate_wmix_icon.py
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: wmix-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
