name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/windows.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Rust unit tests and type checking
        working-directory: src-tauri
        run: |
          cargo test
          cargo check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate official wMix Windows icon
        run: |
          python -m pip install pillow
          python scripts/generate_wmix_icon.py
      - name: Record build revision for MVP testing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-metadata | Out-Null
          Set-Content -Path build-metadata/commit.txt -Value "${{ github.sha }}"
      - name: Install and bundle FFmpeg executable
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          $binary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Filter ffmpeg.exe -Recurse -File | Where-Object { $_.DirectoryName -like '*bin' } | Select-Object -First 1
          if (-not $binary) { throw "Real FFmpeg executable not found; refusing to package PATH shim" }
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          Copy-Item $binary.FullName src-tauri/resources/ffmpeg.exe
          & src-tauri/resources/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg failed to execute" }
      - run: npm run tauri build
      - name: Verify FFmpeg included in installer payload
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw "Windows installer missing" }
          $encoder = Get-Item src-tauri/resources/ffmpeg.exe -ErrorAction Stop
          if ($encoder.Length -lt 100000) { throw "FFmpeg executable unexpectedly small" }
          Write-Host "Bundled encoder bytes: $($encoder.Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: wmix-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            build-metadata/commit.txt
          if-no-files-found: error
          retention-days: 14
