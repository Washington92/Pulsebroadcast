name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/windows.yml'
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Generate temporary Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap(64, 64)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::FromArgb(12, 18, 32))
          $font = New-Object System.Drawing.Font("Arial", 22, [System.Drawing.FontStyle]::Bold)
          $brush = [System.Drawing.Brushes]::White
          $graphics.DrawString("wM", $font, $brush, 3, 12)
          $icon = [System.Drawing.Icon]::FromHandle($bitmap.GetHicon())
          $file = [System.IO.File]::Create("src-tauri/icons/icon.ico")
          try { $icon.Save($file) } finally { $file.Dispose(); $icon.Dispose(); $graphics.Dispose(); $font.Dispose(); $bitmap.Dispose() }
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: wmix-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
