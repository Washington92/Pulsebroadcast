name: wMix Camera Android

on:
  pull_request:
    paths:
      - 'mobile/wmix-camera/**'
      - '.github/workflows/wmix-camera-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/wmix-camera
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wmix-camera-debug
          path: mobile/wmix-camera/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
