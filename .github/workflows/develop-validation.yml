name: wMix develop validation

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: TypeScript and Vite build
        run: npm run build

  tauri:
    name: Rust backend checks (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate official wMix Windows icon
        run: |
          python -m pip install pillow
          python scripts/generate_wmix_icon.py
      - name: Install and bundle FFmpeg executable
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          $binary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Filter ffmpeg.exe -Recurse -File | Where-Object { $_.DirectoryName -like '*bin' } | Select-Object -First 1
          if (-not $binary) { throw "Real FFmpeg executable not found; refusing to package PATH shim" }
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          Copy-Item $binary.FullName src-tauri/resources/ffmpeg.exe
          & src-tauri/resources/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg failed to execute" }
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Rust check
        working-directory: src-tauri
        run: cargo check
