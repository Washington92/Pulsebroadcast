name: Native engine validation
on:
  push:
    branches: [develop]
    paths:
      - 'src-tauri/src/**'
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/native-engine.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'src-tauri/src/**'
      - 'src-tauri/Cargo.toml'
jobs:
  output-state-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run isolated OutputManager tests
        run: |
          rustc --edition=2021 --test src-tauri/src/output_manager.rs -o /tmp/wmix-output-tests
          /tmp/wmix-output-tests
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev pkg-config
      - name: Generate CI-only icon for Tauri context macro
        run: |
          python3 - <<'PY'
          import pathlib, struct, zlib
          width = height = 32
          raw = b"".join(b"\\x00" + b"\\x12\\xb8\\x72\\xff" * width for _ in range(height))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          png = b"\\x89PNG\\r\\n\\x1a\\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          target = pathlib.Path("src-tauri/icons/icon.png")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(png)
          PY
      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
