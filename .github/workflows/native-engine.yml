name: Native engine validation
on:
  push:
    branches: [develop]
    paths:
      - 'src-tauri/src/**'
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/native-engine.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'src-tauri/src/**'
      - 'src-tauri/Cargo.toml'
jobs:
  output-state-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and run isolated OutputManager tests
        run: |
          rustc --edition=2021 --test src-tauri/src/output_manager.rs -o /tmp/wmix-output-tests
          /tmp/wmix-output-tests
      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
